<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión - The Beauty Room</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap');

        body {
            font-family: 'Instrument Sans', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            
            
            background-image: url('/asset/img/parts/fdp.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Un filtro oscuro para que el texto blanco resalte sobre la foto */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Oscurece la imagen un 50% */
            z-index: -1;
        }
        
        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); 
            max-width: 420px;
            width: 100%;
            border: 1px solid #e8dfd5;
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 15px;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: inline-block;
        }

        h1 {
            color: #5a3a22; 
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            color: #7a6a5c;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .btn-reload {
            background-color: #8b5e3c;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-reload:hover {
            background-color: #6e482d;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/icons/icon-192x192.png" alt="The Beauty Room Logo" class="logo">
        
        <div class="icon">📡</div>
        
        <h1>Sin conexión</h1>
        <p>Parece que no tienes internet en este momento. Vuelve a intentarlo cuando estés en línea para gestionar tus citas en The Beauty Room.</p>
        
        <button onclick="window.location.reload()" class="btn-reload">
            Recargar página
        </button>
    </div>
</body>
</html>
